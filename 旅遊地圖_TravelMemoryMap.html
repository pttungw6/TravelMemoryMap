<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3a6f43">
<title>旅遊地圖 TravelMemoryMap</title>
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f8ee;--card:#fff;--ink:#24402a;--sub:#5f7f64;--t1:#4c8a52;--t2:#3a6f43;--t3:#e3f1db;--line:#d1e4c8;--warm:#f4b860;--sea:#5db5d9;--sea2:#3f9cc6;--shadow:0 4px 14px #3a6f431a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#16261a;--card:#1f3524;--ink:#e6f2e0;--sub:#9bbd9f;--t3:#2a4630;--line:#35553b;--shadow:0 4px 14px #0006}}
:root[data-theme="dark"]{--bg:#16261a;--card:#1f3524;--ink:#e6f2e0;--sub:#9bbd9f;--t3:#2a4630;--line:#35553b;--shadow:0 4px 14px #0006}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.55 "PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;display:flex;justify-content:center}
#app{width:100%;max-width:430px;height:100%;display:flex;flex-direction:column;position:relative;overflow:hidden;background:var(--bg)}
header{padding:14px 16px 12px 18px;background:linear-gradient(135deg,#2f6338,#4c8a52 62%,#63a86d);color:#fff;display:flex;align-items:center;gap:10px;box-shadow:0 3px 14px #2f633855;z-index:2}
header b{font-size:19px;letter-spacing:.06em}header small{display:block;font-size:11px;opacity:.85;letter-spacing:.14em}
.logo{width:36px;height:36px;border-radius:50% 50% 50% 8px;background:#ffffff30;display:grid;place-items:center;font-size:19px;box-shadow:inset 0 0 0 1px #ffffff55}
#snd{margin-left:auto;width:36px;height:36px;border-radius:50%;border:0;background:#ffffff26;color:#fff;font-size:17px;cursor:pointer}
main{flex:1;overflow-y:auto;padding:16px 16px 28px;scroll-behavior:smooth}
nav{display:grid;grid-template-columns:repeat(5,1fr);background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:0 -4px 14px #3a6f4314}
nav button{border:0;background:none;padding:8px 2px 7px;color:var(--sub);font:inherit;font-size:11px;cursor:pointer;position:relative;transition:color .2s}
nav button span{display:block;font-size:20px;line-height:1.2;transition:transform .2s}
nav button.on{color:var(--t1);font-weight:700}
nav button.on span{transform:translateY(-2px) scale(1.1)}
nav button.on::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 4px 4px;background:var(--t1)}
nav button:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible,.flip:focus-visible,.spot:focus-visible,.plan:focus-visible{outline:2px solid var(--t1);outline-offset:2px}
h2{font-size:19px;margin:2px 0 4px}h3{font-size:15px;margin:18px 0 8px}
.sub{color:var(--sub);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:10px 0;box-shadow:var(--shadow)}
.btn{border:0;border-radius:999px;background:var(--t1);color:#fff;padding:10px 18px;font:inherit;font-weight:600;cursor:pointer;box-shadow:0 3px 8px #4c8a5240;transition:transform .12s,filter .2s}
.btn:active{transform:scale(.96)}.btn:hover{filter:brightness(1.06)}
.btn.ghost{background:var(--t3);color:var(--t2);box-shadow:none}.btn.full{width:100%;margin-top:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 13px;font:inherit;font-size:13px;cursor:pointer;transition:.15s}
.chip.on{background:var(--t1);color:#fff;border-color:var(--t1)}
.plan{display:flex;gap:12px;align-items:center;cursor:pointer;border:2px solid var(--line);transition:.15s}
.plan.on{border-color:var(--t1);background:var(--t3)}
.plan .ic{font-size:28px;width:46px;height:46px;border-radius:14px;background:var(--t3);display:grid;place-items:center;flex:none}
.plan .pr{margin-left:auto;font-size:12px;color:var(--sub);white-space:nowrap}
input[type=text],input[type=date],textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--card);color:var(--ink);font:inherit}
textarea{resize:none;height:88px}
/* ---- 主地圖：藍色海底 + 去背台灣 ---- */
.sea{position:relative;border-radius:22px;padding:14px 6px 16px;background:radial-gradient(120% 80% at 15% 0%,#86d0ec 0%,var(--sea) 52%,var(--sea2) 100%);overflow:hidden;box-shadow:inset 0 0 0 1px #ffffff45,0 10px 24px #2f7ea538}
.sea .ttl{position:absolute;top:12px;left:16px;color:#fff;font-weight:800;font-size:20px;letter-spacing:.2em;text-shadow:0 2px 6px #1d6c9a66;z-index:1}
.sea .ttl small{display:block;font-size:9px;letter-spacing:.3em;font-weight:600;opacity:.9}
.sea .cnt{position:absolute;top:14px;right:14px;z-index:3;background:#ffffffe6;color:var(--t2);font-size:12px;font-weight:700;border-radius:99px;padding:3px 11px;box-shadow:0 2px 8px #0003}
.sea .wv{position:absolute;opacity:.55;pointer-events:none}
.isle{position:relative;width:94%;margin:22px auto 0;aspect-ratio:488/772}
.isle>img{width:100%;height:100%;display:block;filter:drop-shadow(0 8px 10px #0b4a6c59);-webkit-user-drag:none;user-select:none}
.mk{position:absolute;transform:translate(-50%,-50%);border:0;background:none;padding:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;z-index:2;font:inherit}
.mk .e{width:27px;height:27px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:15px;box-shadow:0 2px 6px #0005;transition:transform .15s}
.mk:hover .e,.mk:active .e{transform:scale(1.2)}
.mk .l{margin-top:2px;font-size:9.5px;font-weight:700;color:#1f3a25;background:#ffffffe0;border-radius:99px;padding:0 6px;white-space:nowrap;line-height:1.5}
.mk.tn{z-index:4}
.mk.tn .e{width:40px;height:40px;font-size:21px;border:3px solid var(--t1);box-shadow:0 3px 10px #0006;position:relative;z-index:1}
.mk.tn .l{background:var(--t2);color:#fff;font-size:11px;padding:1px 9px;position:relative;z-index:1}
.mk.tn::before{content:"";position:absolute;top:0;left:50%;width:40px;height:40px;margin-left:-20px;border-radius:50%;background:#fff;opacity:.7;animation:pulse 1.9s ease-out infinite}
@keyframes pulse{to{transform:scale(2.4);opacity:0}}
.mk.sat{position:absolute}
.mk.sat .e{width:22px;height:22px;font-size:12px;border:2px solid var(--t1)}
.peng{position:absolute;z-index:2;pointer-events:none;display:flex;flex-direction:column;align-items:center}
.peng i{display:block;border-radius:50%;background:#bfe5a8;border:2px solid #fff;box-shadow:0 2px 4px #0003}
.peng span{margin-top:2px;font-size:9.5px;font-weight:700;color:#fff;text-shadow:0 1px 3px #0a4a6c99}
.spot{display:flex;align-items:center;gap:12px;cursor:pointer;transition:transform .12s}
.spot:active{transform:scale(.98)}
.dot{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-size:22px;flex:none;background-size:cover!important;background-position:center!important;box-shadow:0 2px 8px #0003,inset 0 0 0 2px #fff}
.dot.gray{filter:grayscale(.55) brightness(1.05)}
.tag{margin-left:auto;font-size:11px;border-radius:99px;padding:2px 9px;background:var(--t3);color:var(--t2);white-space:nowrap}
.tag.no{background:transparent;border:1px dashed var(--sub);color:var(--sub)}
.sheet{position:absolute;inset:0;background:#0a2a2d99;display:flex;align-items:flex-end;z-index:5}
.sheet>div{background:var(--bg);width:100%;max-height:92%;overflow-y:auto;border-radius:24px 24px 0 0;padding:18px 16px 26px;animation:up .25s ease}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
/* ---- 可翻轉明信片 ---- */
.flip{perspective:1000px;width:100%;aspect-ratio:3/2;cursor:pointer;margin:8px 0}
.flip i{position:relative;display:block;width:100%;height:100%;transition:transform .65s cubic-bezier(.4,.2,.2,1);transform-style:preserve-3d;font-style:normal}
.flip.f i{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:14px;box-shadow:0 10px 24px #3a6f4340;padding:14px;display:flex;flex-direction:column;justify-content:flex-end;color:#fff;overflow:hidden}
.face.ft{border:5px solid #fff;border-bottom-width:5px}
.face.ft::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#0000 52%,#0008)}
.face.ft>*{position:relative}
.face.ft>.big{position:absolute}
.face.bk{transform:rotateY(180deg);background:#fffdf6;color:#3a3a2e;justify-content:space-between;background-image:repeating-linear-gradient(transparent 0 27px,#d9e7e4 28px);border:1px solid #e8dfc8}
.face.bk .top{display:flex;justify-content:space-between;align-items:flex-start}
.pm{font-size:10px;letter-spacing:.25em;color:#a99f86;border-top:1px solid #cfc4a8;padding-top:2px}
.hand{font-family:"Ma Shan Zheng","Kaiti TC",cursive;font-size:20px;line-height:28px}
.stamp{border:2px dashed #4c8a52;color:#4c8a52;border-radius:6px;padding:2px 8px;font-size:11px;transform:rotate(4deg);background:#fffdf6}
.big{font-size:60px;top:14px;right:18px;opacity:.9}
.pill{background:#ffffffe6;color:#1f3a25;border-radius:8px;padding:2px 9px;align-self:flex-start;margin-top:4px;text-shadow:none}
.stack{display:flex;overflow-x:auto;gap:12px;padding:6px 2px 14px;scroll-snap-type:x mandatory}
.stack .flip{min-width:84%;scroll-snap-align:center;margin:0}
/* ---- 電子明信片 ---- */
.pc{aspect-ratio:3/2;border-radius:14px;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;padding:14px;color:#fff;text-shadow:0 1px 6px #0009;border:5px solid #fff;box-shadow:0 8px 20px #3a6f4333}
.pc .pcname{position:absolute;top:10px;left:10px;font-size:12px;background:#ffffffe6;color:#1f3a25;border-radius:8px;padding:2px 9px;text-shadow:none;font-weight:700}
.pc .pctext{font-size:19px;line-height:26px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;word-break:break-all}
.toast{position:absolute;left:50%;bottom:84px;transform:translateX(-50%);background:var(--t2);color:#fff;padding:9px 16px;border-radius:99px;font-size:13px;z-index:9;white-space:nowrap;box-shadow:0 4px 14px #0004}
.guide{background:linear-gradient(135deg,#2f6338,var(--t2));color:#fff;border-radius:16px;padding:14px;margin:10px 0}
.row{display:flex;align-items:center;gap:10px}.sp{margin-left:auto}
.sw{width:44px;height:26px;border-radius:99px;background:var(--line);position:relative;border:0;cursor:pointer;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px #0003}
.sw.on{background:var(--t1)}.sw.on::after{left:21px}
.steps{display:flex;gap:6px;margin:8px 0 4px}.steps i{flex:1;height:5px;border-radius:9px;background:var(--line)}.steps i.on{background:var(--t1)}
.nfc{display:inline-block;border:1.5px solid var(--t1);color:var(--t1);border-radius:8px;padding:0 6px;font-size:11px;align-self:flex-start}
.btn[disabled]{opacity:.4;cursor:default}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style></head><body>
<div id="app">
<header><div class="logo">🧭</div><div><b>旅遊地圖</b><small>TravelMemoryMap</small></div><button id="snd" aria-label="音效開關" aria-pressed="true">🔊</button></header>
<main id="main"></main>
<nav id="nav"></nav>
</div>

let AC=null,muted=false;
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==="suspended")AC.resume();return AC}
function tone(f,t=0,d=.09,type="sine",v=.12,f2){const c=ac();if(!c||muted)return;const o=c.createOscillator(),g=c.createGain(),n=c.currentTime+t;o.type=type;o.frequency.setValueAtTime(f,n);if(f2)o.frequency.exponentialRampToValueAtTime(f2,n+d);g.gain.setValueAtTime(.0001,n);g.gain.exponentialRampToValueAtTime(v,n+.008);g.gain.exponentialRampToValueAtTime(.0001,n+d);o.connect(g);g.connect(c.destination);o.start(n);o.stop(n+d+.03)}
function swoosh(){const c=ac();if(!c||muted)return;const len=Math.floor(c.sampleRate*.22),buf=c.createBuffer(1,len,c.sampleRate),d=buf.getChannelData(0);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*(1-i/len);const s=c.createBufferSource();s.buffer=buf;const f=c.createBiquadFilter();f.type="bandpass";f.Q.value=1.2;const n=c.currentTime;f.frequency.setValueAtTime(500,n);f.frequency.exponentialRampToValueAtTime(3200,n+.2);const g=c.createGain();g.gain.value=.22;s.connect(f);f.connect(g);g.connect(c.destination);s.start()}
const SND={click(){tone(820,0,.07,"triangle",.1,520)},tab(){tone(523,0,.08,"sine",.12);tone(784,.06,.12,"sine",.1)},flip(){swoosh();tone(300,.12,.08,"sine",.05)},ok(){[523,659,784,1047].forEach((f,i)=>tone(f,i*.08,.18,"sine",.12))},on(){tone(600,0,.07,"triangle",.1);tone(900,.06,.09,"triangle",.1)}};

$("#nav").onclick=e=>{const b=e.target.closest("button");if(b){st.tab=+b.dataset.i;render()}};
function toast(m){document.querySelectorAll(".toast").forEach(x=>x.remove());const t=document.createElement("div");t.className="toast";t.textContent=m;$("#app").append(t);setTimeout(()=>t.remove(),2200)}
function sheet(h){close_();const s=document.createElement("div");s.className="sheet";s.innerHTML="<div>"+h+"</div>";s.onclick=e=>{if(e.target===s)close_()};$("#app").append(s)}
function close_(){document.querySelector(".sheet")?.remove()}
/* 照片 / 樣式的共用取用函式：key 可為景點編號、"sun"（夕陽海景）、"t0"/"t1"（App 樣式） */
function faceBg(k){if(k==="sun")return `url(${IMG.sunset}) center/cover`;if(k==="t0")return "linear-gradient(160deg,#7fc8e8,#3d8fbf)";if(k==="t1")return "linear-gradient(160deg,#efe1c0,#c9a56a)";const s=S[k];return s.img?`url(${s.img}) center/cover`:s.g}
function nameOf(k){return k==="sun"?"夕陽海景":k==="t0"?"海風樣式":k==="t1"?"復古樣式":S[k].n}
function iconOf(k){return k==="sun"?"🌅":k==="t0"?"🌊":k==="t1"?"🧭":S[k].e}
const photoKeys=()=>[...S.filter(s=>s.v).map(s=>s.id),"sun"];
/* 明信片（正面照片、背面手寫內容，點一下翻面） */
function flipCard(s){const noImg=!s.img;return `<div class="flip" onclick="this.classList.toggle('f')" tabindex="0" role="button" aria-label="明信片，點一下翻面"><i><div class="face ft" style="background:${s.img?`url(${s.img}) center/cover`:s.g}">${noImg?`<span class="big">${s.e}</span>`:""}<b class="pill" style="font-size:17px">${esc(s.n)}</b><span class="pill" style="font-size:12px">${s.d||""} ・ 點一下翻面</span></div><div class="face bk"><div class="top"><span class="pm">POST CARD</span><span class="stamp">TravelMemoryMap</span></div><div class="hand">${s.note?esc(s.note):"（還沒寫下心情）"}</div><span class="sub" style="font-size:11px">寫給未來的自己</span></div></i></div>`}
/* 電子明信片預覽 */
function pcView(k,tpl,text,live){return `<div class="pc"${live?' id="pv"':""} style="background:${TPL[tpl][1]},${faceBg(k)}"><span class="pcname">${iconOf(k)} ${nameOf(k)}</span><div class="pctext hand"${live?' id="pvt"':""}>${esc(text)}</div></div>`}
function render(){
document.querySelectorAll("nav button").forEach((b,i)=>b.classList.toggle("on",i==st.tab));
[plans,map,book,friends,physical][st.tab]();main.scrollTop=0}
/* 1 旅途方案 */
function plans(){
main.innerHTML=`<h2>規劃你的旅程</h2><p class="sub">先選地點與時間，再挑一個適合你的方案。</p>
<h3>① 地點與時間</h3><div class="card"><div class="chips" id="pl">${["台南市","台北市","花蓮縣","高雄市"].map(p=>`<button class="chip ${p==st.place?"on":""}" data-p="${p}">${p}</button>`).join("")}</div><div style="height:10px"></div><input type="date" id="dt" value="${st.date}" aria-label="出發日期"></div>
<h3>② 選擇方案</h3>${PLANS.map((p,i)=>`<div class="card plan ${st.plan===i?"on":""}" data-i="${i}" tabindex="0"><div class="ic">${p[0]}</div><div><b>${p[1]}</b><div class="sub">${p[2]}</div></div><span class="pr">價格待定</span></div>`).join("")}
<h3>③ 加購</h3><div class="card row"><div>💌 <b>實體明信片（含 NFC）</b><div class="sub">旅途回憶寄給未來的自己</div></div><button class="sw sp ${st.addon?"on":""}" id="ad" aria-label="加購實體明信片"></button></div>
<button class="btn full" id="go">確認方案</button>`;
$("#pl").onclick=e=>{const b=e.target.closest("[data-p]");if(b){st.place=b.dataset.p;plans()}};
$("#dt").onchange=e=>st.date=e.target.value;
main.querySelectorAll(".plan").forEach(c=>c.onclick=()=>{st.plan=+c.dataset.i;plans()});
$("#ad").onclick=()=>{st.addon=!st.addon;plans()};
$("#go").onclick=()=>{if(st.plan===null)return toast("請先選擇一個方案");
SND.ok();
sheet(`<h2>方案摘要</h2><div class="card">📍 ${st.place}<br>📅 ${st.date||"尚未選擇日期"}<br>${PLANS[st.plan][0]} ${PLANS[st.plan][1]}<br>${st.addon?"💌 已加購實體明信片":"（未加購明信片）"}<br><b>價格：待定</b></div>${st.plan==4?'<div class="card sub">🎬 出發後 App 會顯示分鏡指示（例：5 秒店家門口、10 秒料理特寫），拍完上傳素材即可。</div>':""}<button class="btn full" onclick="close_();guide(0)">開始導覽，邊玩邊看故事</button>`)}}
/* 2 主地圖 */
const WAVE='<svg class="wv" style="WS" width="64" height="12" viewBox="0 0 64 12" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M2 7q7-7 14 0t14 0 14 0 14 0"/></svg>';
function map(){
const done=S.filter(s=>s.v).length;
const P=(x,y)=>`left:${(x/488*100).toFixed(2)}%;top:${(y/772*100).toFixed(2)}%`;
main.innerHTML=`<h2>我的足跡地圖</h2><p class="sub">已打卡 ${done} 個景點。點台南標記查看景點。</p>
<div class="sea" style="margin-top:10px">
<div class="ttl">TAIWAN<small>TRAVEL MAP</small></div><div class="cnt">📍 ${done}/${S.length} 已打卡</div>
${WAVE.replace("WS","left:8px;top:330px")}${WAVE.replace("WS","right:6px;top:250px")}${WAVE.replace("WS","left:10px;bottom:150px")}${WAVE.replace("WS","right:8px;bottom:60px")}${WAVE.replace("WS","left:30%;bottom:18px")}
<div class="isle" role="img" aria-label="台灣旅遊插畫地圖"><img src="${IMG.island}" alt="" draggable="false">
<div class="peng" style="${P(14,395)}"><div style="display:flex;gap:2px;align-items:flex-end"><i style="width:14px;height:9px"></i><i style="width:9px;height:6px"></i></div><span>澎湖</span></div>
${MK.map((m,i)=>`<button class="mk" data-m="${i}" style="${P(m[2],m[3])}" aria-label="${m[0]}"><span class="e">${m[1]}</span><span class="l">${m[0]}</span></button>`).join("")}

<button class="mk tn" id="tn" style="${P(66,492)}" aria-label="台南 ${done}/${S.length}"><span class="e">🏯</span><span class="l">台南 ${done}/${S.length}</span></button>
</div></div>
<button class="btn full" onclick="guide(0)">📖 開啟台南導覽</button>
<h3 id="spots">台南市景點</h3>${S.map(s=>`<div class="card spot" data-i="${s.id}" tabindex="0"><div class="dot ${s.v?"":"gray"}" style="background:${s.img?`url(${s.img})`:s.g}">${s.img?"":s.e}</div><div><b>${s.n}</b><div class="sub">${s.v?"已打卡 "+s.d:"尚未抵達"}</div></div><span class="tag ${s.v?"":"no"}">${s.v?"✓ 已打卡":"待探索"}</span></div>`).join("")}
<div class="card row"><span>🔗</span><div class="sub">打卡方式：到達自動定位，或手動標註已去過的景點</div></div>`;
$("#tn").onclick=()=>$("#spots").scrollIntoView({behavior:"smooth"});
main.querySelectorAll(".mk[data-m]").forEach(b=>b.onclick=()=>toast(MK[+b.dataset.m][0]+" 景點即將開放"));
main.querySelectorAll(".spot").forEach(c=>c.onclick=()=>spot(+c.dataset.i))}
function spot(i){const s=S[i];
if(s.v){sheet(`<h2>${s.e} ${s.n}</h2><p class="sub">${s.d} 打卡 ・ 當下的照片與心情</p>${flipCard(s)}<label class="btn ghost" style="display:inline-block;margin:4px 0">📷 換成實景照片<input type="file" accept="image/*" hidden onchange="setImg(${i},this)"></label><div class="guide"><b>導覽</b><div style="font-size:13px">${s.guide}</div></div><div class="row"><button class="btn" onclick="design(${i})">設計電子明信片</button>${ST[i]?`<button class="btn ghost" onclick="close_();guide(${i})">看故事</button>`:""}<button class="btn ghost sp" onclick="close_()">關閉</button></div>`)}
else{sheet(`<h2>${s.e} ${s.n}</h2><p class="sub">尚未打卡。示範：模擬你走到這個景點。</p><button class="btn full" onclick="arrive(${i})">📍 模擬抵達景點</button>`)}}
function setImg(i,el){const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{S[i].img=r.result;spot(i)};r.readAsDataURL(f)}
function arrive(i){const s=S[i];
sheet(`<div class="guide"><b>📍 你已抵達 ${s.n}</b><div style="font-size:13px;margin-top:4px">${s.guide}</div></div><h3>附近推薦</h3><div class="chips">${s.near.map(n=>`<span class="chip">${n}</span>`).join("")}</div>
<h3>記錄此刻</h3><div class="card" style="text-align:center"><div style="height:130px;border-radius:12px;background:${s.img?`url(${s.img}) center/cover`:s.g};display:grid;place-items:center;font-size:44px">${s.img?"":s.e}</div><div class="sub" style="margin:6px 0">📷 示範照片（實際會開啟相機）</div></div>
<textarea id="mood" placeholder="寫下你當下的心情…"></textarea><button class="btn full" onclick="saveSpot(${i})">儲存並打卡</button>`)}
function saveSpot(i){const s=S[i];s.v=1;s.d=today();s.note=$("#mood").value||"今天走到這裡，很開心。";close_();SND.ok();toast("已打卡，加入回憶簿");render();setTimeout(()=>spot(i),300)}
/* 3 回憶簿 */
function book(){
const vis=S.filter(s=>s.v);
const alb=[...vis,{n:"海邊夕陽",e:"🌅",g:G[3],img:IMG.sunset,d:"10/13",note:"整片天空燒成橘紫色，大家都安靜地看著。"}];
main.innerHTML=`<h2>回憶簿</h2><p class="sub">左右滑動瀏覽，點明信片翻面看你寫給自己的話。</p>
<h3>旅行相簿</h3><div class="stack">${alb.map(flipCard).join("")||'<div class="card sub">還沒有紀錄，去地圖打卡第一個景點吧。</div>'}</div>
<h3>電子明信片</h3>${st.pc.map((p,k)=>`<div class="card">${pcView(p.s,p.tpl,p.t)}<div class="row" style="margin-top:10px"><button class="btn ghost" onclick="pcToPhysical(${k})">改寄實體明信片</button></div></div>`).join("")}
<button class="btn full" onclick="design(${vis.length?vis[0].id:"'sun'"})">＋ 設計新的電子明信片</button>`}
function pcToPhysical(k){const p=st.pc[k];st.pcText=p.t;st.pcPhoto=p.s;st.tab=4;render()}
function design(k){
const text=typeof k==="number"?(S[k].note||""):"願你記得這個夕陽。";
sheet(`<h2>客製電子明信片</h2><div id="pvwrap">${pcView(k,st.tpl,text,1)}</div>
<h3>選擇樣式</h3><div class="chips" id="tp">${TPL.map((n,j)=>`<button class="chip ${j==st.tpl?"on":""}" data-k="${j}">${n[0]}</button>`).join("")}</div>
<h3>選擇照片</h3><div class="chips">${photoKeys().map(x=>`<button class="chip ${x===k?"on":""}" onclick="design(${K(x)})">${iconOf(x)} ${nameOf(x)}</button>`).join("")}</div>
<h3>寫下想說的話</h3><textarea id="pt" class="hand" placeholder="寫給自己或朋友…">${esc(text)}</textarea>
<div class="row" style="margin-top:10px"><button class="btn" onclick="savePc(${K(k)})">儲存到回憶簿</button><button class="btn ghost" onclick="st.pcText=$('#pt').value;st.pcPhoto=${K(k)};close_();st.tab=4;render()">改成實體寄送</button></div>`);
$("#pt").oninput=e=>{$("#pvt").textContent=e.target.value};
$("#tp").onclick=e=>{const b=e.target.closest("[data-k]");if(b){st.tpl=+b.dataset.k;$("#pv").style.background=TPL[st.tpl][1]+","+faceBg(k);document.querySelectorAll("#tp .chip").forEach(c=>c.classList.toggle("on",c===b))}}}
function savePc(k){st.pc.unshift({t:$("#pt").value||"留下這一刻。",tpl:st.tpl,s:k});close_();SND.ok();toast("電子明信片已儲存");render()}
/* 4 好友 */
function friends(){
main.innerHTML=`<h2>好友</h2><p class="sub">和朋友互看旅行故事，內容由你決定是否分享。</p>
<div class="card row"><div><b>分享我的旅行故事</b><div class="sub">${st.share?"好友可看到你的回憶簿與地圖":"目前只有你自己看得到"}</div></div><button class="sw sp ${st.share?"on":""}" id="sh" aria-label="分享旅行故事"></button></div>
<div class="card sub" id="sel" style="${st.share?"":"display:none"}">分享範圍：<div class="chips" style="margin-top:6px"><span class="chip on">照片</span><span class="chip on">心情文字</span><span class="chip">精確位置</span></div></div>
<h3>好友的動態</h3>${FR.map((f,i)=>`<div class="card spot" data-i="${i}" tabindex="0"><div class="dot" style="background:${f[4]?`url(${f[4]})`:"var(--t3)"}">${f[4]?"":f[1]}</div><div><b>${f[0]} ${f[1]}</b><div class="sub">${f[3]?f[2]:"未分享旅行故事"}</div></div><span class="tag ${f[3]?"":"no"}">${f[3]?"查看":"私人"}</span></div>`).join("")}
<button class="btn ghost full">＋ 新增好友</button>`;
$("#sh").onclick=()=>{st.share=!st.share;friends()};
main.querySelectorAll(".spot").forEach(c=>c.onclick=()=>{const f=FR[+c.dataset.i];if(!f[3])return toast(f[0]+" 沒有公開旅行故事");
sheet(`<h2>${f[1]} ${f[0]} 的旅行故事</h2><p class="sub">${f[2]}</p>${flipCard({n:f[2],e:f[1],g:G[+c.dataset.i+1],img:f[4],d:"上週",note:f[5]})}<button class="btn ghost full" onclick="close_()">關閉</button>`)})}
/* 5 實體明信片 */
function physical(){
const photos=S.filter(s=>s.v);
const W=["準備好就寄出","3 個月後","半年後","一年後"];
const ready=st.pcText||st.scan?"on":"";
const opts=[...photos.map(s=>s.id),"sun","t0","t1"];
main.innerHTML=`<h2>客製實體明信片</h2><p class="sub">寫給未來的自己，像時間膠囊一樣寄達。</p><div class="steps"><i class="on"></i><i class="${ready}"></i><i class="${ready}"></i><i class="on"></i></div>
<h3>① 寫下想說的話</h3><div class="card"><textarea id="tx" class="${st.hand?"hand":""}" placeholder="直接打字，或在白紙手寫後掃描…">${esc(st.pcText)}</textarea>
<div class="row" style="margin-top:8px"><label class="row sub"><input type="checkbox" id="hd" ${st.hand?"checked":""}> 轉成手寫字體</label><button class="btn ghost sp" id="sc">📷 掃描手寫紙</button></div>${st.scan?'<div class="sub" style="margin-top:6px">✓ 已掃描手寫內容</div>':""}</div>
<h3>② 選擇相片或 App 樣式</h3><div class="chips">${opts.map(k=>`<button class="chip ${st.pcPhoto===k?"on":""}" data-p="${k}">${typeof k==="number"||k==="sun"?iconOf(k):"🎨"} ${nameOf(k)}</button>`).join("")}</div>
<h3>③ 選擇收到的時間</h3><div class="chips" id="wh">${W.map(w=>`<button class="chip ${w==st.when?"on":""}" data-w="${w}">${w}</button>`).join("")}</div>
<h3>預覽</h3><div class="flip" onclick="this.classList.toggle('f')" tabindex="0" role="button" aria-label="明信片預覽，點一下翻面"><i><div class="face ft" style="background:${faceBg(st.pcPhoto)}"><span class="big">${typeof st.pcPhoto==="number"&&S[st.pcPhoto].img||st.pcPhoto==="sun"?"":iconOf(st.pcPhoto)}</span><b class="pill" style="font-size:15px">TravelMemoryMap</b><span class="pill" style="font-size:12px">正面：旅途照片 ・ 點擊翻面</span></div><div class="face bk"><div class="top"><span class="pm">POST CARD</span><span class="stamp">寄達：${st.when}</span></div><div class="hand">${st.pcText?esc(st.pcText):"（你的話會出現在這裡）"}</div><span class="nfc">NFC 感應晶片</span></div></i></div>
<div class="card row"><span style="font-size:26px">📲</span><div class="sub">明信片內建 <b>NFC</b>。手機靠近就會跳出整理好的旅遊照片與回憶。</div></div>
<button class="btn ghost full" id="nf">模擬手機感應 NFC</button>
<div class="card row"><b>價格</b><span class="sp sub">價格待定</span></div><button class="btn full" id="ord">送出訂單</button>`;
$("#tx").oninput=e=>st.pcText=e.target.value;
$("#hd").onchange=e=>{st.hand=e.target.checked;physical()};
$("#sc").onclick=()=>{st.scan=true;st.pcText=st.pcText||"願未來的我，依然愛冒險。";physical();SND.ok();toast("掃描完成，已辨識文字")};
main.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{const v=b.dataset.p;st.pcPhoto=/^\d+$/.test(v)?+v:v;physical()});
$("#wh").onclick=e=>{const b=e.target.closest("[data-w]");if(b){st.when=b.dataset.w;physical()}};
$("#nf").onclick=()=>{SND.ok();sheet(`<h2>📲 NFC 感應成功</h2><p class="sub">以下是這張明信片連結的旅程回憶</p>${photos.map(flipCard).join("")}<button class="btn ghost full" onclick="close_()">關閉</button>`)};
$("#ord").onclick=()=>{SND.ok();toast("已送出，預計："+st.when)}}
/* 導覽 */

["鄭成功設承天府","1661 年鄭成功驅逐荷蘭人後，在這裡設府署，改為承天府治。園區草坪上，有「國姓爺受降」的雕像。","站在雕像前，想一想：一座城為什麼會同時有荷蘭、明鄭、清朝的痕跡？"],
["海神廟與文昌閣","今天所見的海神廟與文昌閣，是漢人在荷蘭城堡舊址上陸續興建的，文昌閣供奉魁星爺，考季常有學子前來祈求金榜題名。","魁星爺右腳踩鰲魚、一手持筆，象徵「獨占鰲頭」。"],
["九隻贔屭背碑","1960 年，九座贔屭碑從大南門遷到這裡，碑文為乾隆皇帝所撰。傳說贔屭是龍的孩子，生性愛負重，所以馱著石碑。","數數看：九隻石龜，是不是真的都不一樣？"],
["對街的月老","赤崁樓對街是祀典武廟，旁邊走過媽祖梳妝樓就是大天后宮，兩座廟都被稱為府城四大月老之一。","走過去求支籤，再前往下一站神農街。"]]},
{r:"五條港的商業老街",n:["永川大轎","水仙宮市場小吃","藥王廟"],c:[
["曾經是海，後來是港","神農街舊名北勢街，位於五條港區域。清道光年間曾文溪氾濫、泥沙淤積，形成五條港道。商人、官員換小船入市區，「一府二鹿三艋舺」的「一府」指的就是這一帶。","沿街走一遍，想像兩旁原本有河道與貨船。"],
["為什麼二樓有門？","老屋面寬窄、縱深長，二樓常有往外探出的木陽台。當年河道就在屋後，貨物直接從二樓吊進倉庫。","抬頭看二樓的門與陽台，這是五條港最直觀的證據。"],
["藥王廟與金華府","街尾的全台開基藥王廟主祀神農大帝，創建於康熙 24 年（1685），街名也因此從北勢街改為神農街。街中段的金華府主祀關聖帝君，相傳由來自泉州晉江、在碼頭工作的許姓族人集資興建。","走到街尾看藥王廟，再回頭看整條街的方向感。"],
["港口淤積，老街被保留","港道淤積，日治時期又開鑿台南運河，五條港逐漸沒落。神農街因街道狹窄、改建困難，反而完整保留了清代到日治初期的街屋。","留意街上的石板路與街屋立面。"],
["夜晚變成熱門景點","據當地導覽老師說，二十年前這裡還是安靜的住宅區，後來有外國記者報導它的夜景與氣氛，才帶動店家進駐。附近還有永川大轎等傳統工藝。","晚上再走一次，看燈光下的街屋；也別忘了寫下今天的心情。"]]}];
